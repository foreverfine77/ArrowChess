<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eeefe5" />
    <title>箭棋</title>
    <link rel="icon" href="./icon.png" type="image/png" />
    <style>
      :root {
        color-scheme: light;
        --paper: #eeefe5;
        --glow: #faf7ed;
        --card: #f8f8ef;
        --ink: #26382e;
        --muted: #4d6053;
        --line: #d3dac9;
        --accent: #31543f;
        --arena-top: #e4e9d9;
        --arena-bottom: #d3dec9;
        --arena-border: #cad5bd;
        --frame: #dce4cc;
        --frame-border: #bac8aa;
        --frame-shadow: #354c3519;
        --surface: #f8fbf04f;
        --surface-hover: #b7cba365;
        --row: #eef1e5;
        --row-active: #dbe8d4;
        --row-border: #879d80;
        --cinnabar: #983b2e;
        --gold: #795319;
        --gold-border: #b09a60;
        --glass-light: #fffef7e0;
        --glass-base: #e6eedacc;
        --glass-rim: #fafff6e0;
        --glass-shadow: #2a473638;
        --radius: 22px;
        --font-ui: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
        --font-title: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "Noto Serif CJK SC", serif;
        --font-ming: "Arrow Ming", var(--font-title);
        --font-brush: "Arrow Brush", "Kaiti SC", KaiTi, var(--font-title);
        font-family: var(--font-ui);
      }
      body[data-theme="ink"] {
        color-scheme: dark;
        --paper: #192820;
        --glow: #293b31;
        --card: #26382e;
        --ink: #edf0e1;
        --muted: #c4d1bf;
        --line: #4b6151;
        --accent: #caddb4;
        --arena-top: #304637;
        --arena-bottom: #283b30;
        --arena-border: #475f4c;
        --frame: #435944;
        --frame-border: #62775a;
        --frame-shadow: #121e1a50;
        --surface: #edf4d61a;
        --surface-hover: #c9e1b444;
        --row: #314539;
        --row-active: #435b48;
        --row-border: #8a9e7e;
        --cinnabar: #f0a28c;
        --gold: #fae2a3;
        --gold-border: #bfa269;
        --glass-light: #81968370;
        --glass-base: #354a3bcc;
        --glass-rim: #c1d9b65f;
        --glass-shadow: #07150e78;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(ellipse at 12% 0%, var(--glow) 0, transparent 65%), var(--paper);
        color: var(--ink);
        padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }
      button, select { font: inherit; color: inherit; }
      button, select, summary { touch-action: manipulation; }
      button, select {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 10px;
        min-height: 44px;
      }
      button { cursor: pointer; padding: 0 10px; font-weight: 600; }
      button:disabled, select:disabled { opacity: .5; cursor: default; }
      button:focus-visible, select:focus-visible, summary:focus-visible {
        outline: 3px solid #987337;
        outline-offset: 3px;
      }
      @media (hover: hover) {
        button:not(:disabled):not(.point):not(.glass-button):hover { border-color: var(--row-border); background: var(--row-active); }
      }
      .shell { width: min(100%, 1020px); margin-inline: auto; }
      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-block: 16px 22px;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
      }
      .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
      .mark {
        display: block;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        object-fit: cover;
      }
      h1, h2, p { margin: 0; }
      h1 { font-family: var(--font-brush); font-size: clamp(30px, 4.5vw, 47px); font-weight: 400; line-height: 1; letter-spacing: .075em; }
      .subtitle { color: var(--muted); font-size: 12px; line-height: 1.5; letter-spacing: .025em; margin-top: 4px; }
      .top-controls { display: flex; flex: none; gap: 8px; }
      .glass-button {
        display: grid;
        place-items: center;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--glass-rim);
        border-radius: 50%;
        background: radial-gradient(ellipse at 27% 17%, var(--glass-light) 0, transparent 65%), var(--glass-base);
        box-shadow: inset 1px 1px 0 var(--glass-rim), inset -2px -3px 5px var(--glass-shadow), 0 3px 9px var(--glass-shadow);
        backdrop-filter: blur(10px) saturate(1.3);
        -webkit-backdrop-filter: blur(10px) saturate(1.3);
      }
      .glass-button::before {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: inherit;
        border-top: 1px solid var(--glass-rim);
        pointer-events: none;
      }
      @media (hover: hover) {
        .glass-button:hover { box-shadow: inset 1px 1px 0 var(--glass-rim), 0 3px 12px var(--glass-shadow); }
      }
      .glass-button:active { box-shadow: inset 2px 3px 7px var(--glass-shadow); }
      .sound-icon { font: 600 23px/1 "Segoe UI Symbol", system-ui, sans-serif; }
      #sound[aria-pressed="false"] .sound-icon { opacity: .62; }
      #sound[aria-pressed="false"]::after {
        content: "";
        position: absolute;
        width: 21px;
        height: 2px;
        border-radius: 1px;
        background: currentColor;
        transform: rotate(-43deg);
      }
      .theme-icon {
        width: 17px;
        height: 17px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
        background: linear-gradient(90deg, currentColor 50%, transparent 50%);
        transform: rotate(38deg);
      }
      #theme[aria-pressed="true"] .theme-icon { transform: rotate(218deg); }
      #app { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 22px; align-items: start; }
      .arena {
        background: linear-gradient(150deg, var(--arena-top), var(--arena-bottom));
        border: 1px solid var(--arena-border);
        border-radius: var(--radius);
        padding: clamp(13px, 2vw, 22px);
        box-shadow: 0 10px 24px var(--frame-shadow);
        min-width: 0;
      }
      .players { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 9px; margin-bottom: 12px; }
      .player {
        display: flex;
        align-items: center;
        justify-self: start;
        gap: 6px;
        white-space: nowrap;
      }
      .player:last-child { justify-self: end; }
      .player-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
        padding: 3px 9px;
        border: 1px solid var(--frame-border);
        border-radius: 999px;
        font-size: 13px;
      }
      .player.active .player-badge {
        background: var(--surface-hover);
        border-color: var(--row-border);
        box-shadow: 0 2px 6px var(--frame-shadow);
      }
      .player b { font-family: var(--font-ming); font-weight: 600; }
      .player small { font-size: 11px; color: var(--muted); }
      .player:last-child .player-token { order: 1; }
      .player-token { display: inline-block; flex: 0 0 14px; height: 14px; border-radius: 50%; border: 1px solid #faf3de9c; }
      .player-token.red { background: #bc624e; }
      .player-token.black { background: #26352d; }
      #turnCount { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .board-frame {
        padding: clamp(6px, 1.25vw, 12px);
        border-radius: 17px;
        border: 1px solid var(--frame-border);
        background: linear-gradient(150deg, var(--arena-top), var(--frame));
        box-shadow: 0 3px 9px var(--frame-shadow), inset 0 0 0 2px var(--surface);
      }
      .board-surface { position: relative; aspect-ratio: 1; isolation: isolate; }
      #board { display: block; position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 12px; }
      #points { position: absolute; inset: 0; }
      .point {
        position: absolute;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        width: 14%;
        height: 14%;
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      .point:focus-visible { outline: 2px dashed var(--ink); outline-offset: -4px; }
      @media (hover: hover) {
        .arena:not(.finished) .point:hover { box-shadow: inset 0 0 0 1px var(--row-border); }
      }
      .game-note { display: flex; flex-direction: column; gap: 4px; min-height: 71px; padding: 12px 2px 9px; }
      .game-note, .actions, .replay-actions, .field { font-family: var(--font-ming); }
      #status { font-size: clamp(15px, 2.3vw, 19px); font-weight: 700; line-height: 1.35; }
      #statusDetail { color: var(--muted); font-size: 12px; font-weight: 500; line-height: 1.5; }
      .arena.finished #status { color: var(--gold); }
      .arena.finished .board-frame { border-color: var(--gold-border); }
      .replay-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
      .actions { display: flex; justify-content: center; align-items: center; gap: clamp(6px, 1vw, 10px); }
      .actions button {
        inline-size: clamp(64px, 18vw, 84px);
        max-inline-size: 100%;
        padding-inline: 5px;
        border-radius: 999px;
        background: var(--surface);
        border-color: var(--frame-border);
      }
      .actions .primary { color: var(--accent); background: var(--row-active); border-color: var(--row-border); }
      @media (hover: hover) {
        .arena .actions button:not(:disabled):hover { background: var(--surface-hover); }
        .arena .actions .primary:not(:disabled):hover { background: var(--row-active); border-color: var(--accent); }
      }
      .sidebar { display: grid; gap: 14px; min-width: 0; }
      .card {
        padding: clamp(14px, 2vw, 20px);
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: 0 3px 8px #23382908;
      }
      .card h2 { font: 400 22px/1.1 var(--font-brush); margin-bottom: 13px; }
      .settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .field { display: grid; gap: 5px; min-width: 0; font-size: 12px; color: var(--muted); }
      .field select, .select-trigger { width: 100%; color: var(--ink); font-size: 16px; font-weight: 500; }
      .field select { padding-inline: 8px 3px; }
      .select-menu { position: relative; }
      .select-menu[data-open] { z-index: 5; }
      .select-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        text-align: start;
        padding-inline: 8px;
      }
      .select-trigger span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .select-trigger::after {
        content: "";
        flex: 0 0 7px;
        height: 7px;
        border: solid var(--muted);
        border-width: 0 1.5px 1.5px 0;
        transform: translateY(-2px) rotate(45deg);
        transition: transform 160ms ease;
      }
      .select-trigger[aria-expanded="true"] {
        border-color: var(--row-border);
        background: var(--row-active);
      }
      .select-trigger[aria-expanded="true"]::after { transform: translateY(2px) rotate(225deg); }
      .select-list {
        --enter-offset: -5px;
        position: absolute;
        inset: calc(100% + 6px) 0 auto;
        padding: 4px;
        overflow: auto;
        overscroll-behavior: contain;
        border: 1px solid var(--frame-border);
        border-radius: 12px;
        background: linear-gradient(145deg, var(--card), var(--row));
        box-shadow: 0 9px 18px var(--frame-shadow);
        color: var(--ink);
        visibility: hidden;
        opacity: 0;
        transform: translateY(var(--enter-offset)) scale(.97);
        transform-origin: top center;
        pointer-events: none;
        transition: opacity 150ms ease, transform 170ms ease, visibility 0s linear 170ms;
      }
      .select-menu[data-side="above"] .select-list {
        --enter-offset: 5px;
        inset: auto 0 calc(100% + 6px);
        transform-origin: bottom center;
      }
      .select-menu[data-open] .select-list {
        visibility: visible;
        opacity: 1;
        transform: none;
        pointer-events: auto;
        transition-delay: 0s;
      }
      .select-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
        min-height: 42px;
        border-color: transparent;
        border-radius: 7px;
        text-align: start;
        background: transparent;
        font-size: 15px;
        font-weight: 500;
      }
      .select-option[aria-selected="true"], .select-option:focus-visible { background: var(--row-active); }
      .select-option:focus-visible { outline: 1px solid var(--row-border); outline-offset: -1px; }
      .select-option[aria-selected="true"]::after {
        content: "";
        flex: 0 0 9px;
        height: 5px;
        border: solid var(--accent);
        border-width: 0 0 1.5px 1.5px;
        transform: translateY(-1px) rotate(-45deg);
      }
      @media (prefers-reduced-motion: reduce) {
        .select-list, .select-trigger::after { transition: none; }
      }
      .ai-only { display: none; }
      body.ai .ai-only { display: grid; }
      .disclosure { padding-block: 0; }
      .disclosure summary {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 48px;
        cursor: pointer;
        list-style: none;
        font: 400 19px/1.2 var(--font-brush);
      }
      .disclosure summary::-webkit-details-marker { display: none; }
      .disclosure summary::before {
        content: "";
        width: 6px;
        height: 6px;
        border: solid var(--muted);
        border-width: 0 1.5px 1.5px 0;
        transform: rotate(-45deg);
      }
      .disclosure[open] summary::before { transform: rotate(45deg); }
      .disclosure[open] { padding-bottom: 14px; }
      #historyCount { color: var(--muted); font-size: 12px; white-space: nowrap; }
      .disclosure summary #historyCount { margin-inline-start: auto; font-family: var(--font-ui); }
      .replay-actions button { font-size: 12px; padding-inline: 3px; }
      #replayInfo { color: var(--muted); font-size: 12px; margin-top: 8px; }
      #replayInfo:empty { display: none; }
      #historyEmpty { border: 1px dashed var(--line); border-radius: 9px; padding: 14px 8px; text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
      #movelist { display: grid; gap: 5px; max-height: 220px; overflow: auto; margin: 10px 0 0; padding: 0 4px; list-style: none; }
      #movelist:empty { display: none; }
      .history-move {
        display: grid;
        align-items: center;
        grid-template-columns: 2ch 1fr auto;
        gap: 9px;
        text-align: left;
        width: 100%;
        min-height: 40px;
        background: var(--row);
        border-color: transparent;
        font-size: 13px;
      }
      .history-move[aria-current="step"] { background: var(--row-active); border-color: var(--row-border); }
      .move-number, .move-path { font-variant-numeric: tabular-nums; }
      .move-number { color: var(--muted); }
      .move-side.red { color: var(--cinnabar); }
      .move-path { font-family: var(--font-brush); font-size: 15px; }
      .rules ol { color: var(--muted); font-size: 13px; margin: 0; padding-inline-start: 20px; line-height: 1.65; }
      .rules li + li { margin-top: 4px; }
      @media (min-width: 721px) and (min-height: 551px) and (max-height: 820px) {
        .shell { max-width: clamp(620px, calc((100dvh - 256px) * 1.69 + 18px), 1020px); }
        .masthead { padding-block: 6px 10px; margin-bottom: 12px; }
        #app { gap: 18px; }
        .arena { padding: 15px; }
        .players { margin-bottom: 8px; }
        .game-note { min-height: 58px; padding-block: 8px; }
      }
      @media (max-width: 720px) {
        .shell { max-width: 490px; }
        .masthead { padding-block: 5px 11px; margin-bottom: 12px; }
        #app { grid-template-columns: 1fr; gap: 12px; }
        .sidebar { gap: 10px; }
      }
      @media (max-width: 370px) {
        body { padding-inline: max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-right)); }
        .brand { gap: 8px; }
        .mark { flex-basis: 38px; width: 38px; height: 38px; }
        .player, .player-badge { gap: 4px; }
        .player-badge { padding-inline: 7px; }
        .players { gap: 4px; }
      }
      @media (orientation: landscape) and (min-width: 500px) and (max-height: 550px) {
        body { padding-top: max(7px, env(safe-area-inset-top)); }
        .shell { max-width: 850px; }
        .masthead { padding-block: 0 6px; margin-bottom: 8px; }
        .mark { flex-basis: 38px; width: 38px; height: 38px; }
        .subtitle { display: none; }
        #app { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
        .arena {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 54px;
          grid-template-areas: "players players" "board actions" "status status";
          column-gap: 7px;
          align-items: center;
          padding: 8px;
        }
        .players { grid-area: players; margin-bottom: 6px; }
        .board-frame { grid-area: board; width: min(100%, max(145px, calc(100dvh - 187px))); margin-inline: auto; }
        .game-note { grid-area: status; min-height: 48px; padding-block: 6px 0; }
        .actions { grid-area: actions; flex-direction: column; gap: 5px; }
      }
      @media (forced-colors: active) {
        .point { border: 1px solid ButtonText; }
        .player.active .player-badge { border-color: Highlight; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <img class="mark" src="./icon.png" width="48" height="48" alt="" />
          <div><h1>箭棋</h1><p class="subtitle">占领路径，封锁对手的退路</p></div>
        </div>
        <div class="top-controls" role="group" aria-label="显示与音效">
          <button type="button" class="glass-button" id="theme" aria-pressed="false" aria-label="墨夜主题" title="切换到墨夜主题">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
          <button type="button" class="glass-button" id="sound" aria-pressed="true" aria-label="音效" title="关闭音效">
            <span class="sound-icon" aria-hidden="true">♪</span>
          </button>
        </div>
      </header>
      <main id="app">
        <section class="arena" id="arena" aria-label="对局棋盘">
          <div class="players">
            <div class="player active" id="redPlayer">
              <span class="player-badge"><span class="player-token red" aria-hidden="true"></span><b>红方</b></span>
              <small id="redRole" hidden></small>
            </div>
            <span id="turnCount">放置 1 / 2</span>
            <div class="player" id="blackPlayer">
              <small id="blackRole" hidden></small>
              <span class="player-badge"><span class="player-token black" aria-hidden="true"></span><b>黑方</b></span>
            </div>
          </div>
          <div class="board-frame">
            <div class="board-surface">
              <canvas id="board" aria-hidden="true"></canvas>
              <div id="points" role="group" aria-label="棋盘，九个落点" aria-describedby="keyboardHelp"></div>
            </div>
          </div>
          <div class="game-note" role="status" aria-atomic="true">
            <p id="status">正在加载棋盘…</p>
            <p id="statusDetail"></p>
          </div>
          <div class="actions" aria-label="对局操作">
            <button type="button" id="undo" disabled>悔棋</button>
            <button type="button" id="hint" disabled>提示</button>
            <button type="button" class="primary" id="newGame">新局</button>
          </div>
        </section>
        <aside class="sidebar" aria-label="对局设置与棋谱">
          <section class="card" aria-labelledby="settingsTitle">
            <h2 id="settingsTitle">对局设置</h2>
            <div class="settings">
              <div class="field"><label for="mode">模式</label>
                <select id="mode"><option value="2p">本地双人</option><option value="ai">人机对弈</option></select>
              </div>
              <div class="field"><label for="first">先手</label>
                <select id="first"><option value="red">红方</option><option value="black">黑方</option></select>
              </div>
              <div class="field ai-only"><label for="humanSide">执方</label>
                <select id="humanSide"><option value="red">红方</option><option value="black">黑方</option></select>
              </div>
              <div class="field ai-only"><label for="difficulty">难度</label>
                <select id="difficulty"><option value="easy">简单</option><option value="medium" selected>中等</option><option value="hard">困难</option></select>
              </div>
            </div>
          </section>
          <details class="card disclosure" id="historyPanel">
            <summary>棋谱<span id="historyCount">0 手</span></summary>
            <div class="replay-actions" aria-label="回放操作">
              <button type="button" id="stepBack" disabled>上一步</button>
              <button type="button" id="stepFwd" disabled>下一步</button>
              <button type="button" id="toLive" disabled>返回实况</button>
            </div>
            <p id="replayInfo"></p>
            <p id="historyEmpty">走法会记录在这里</p>
            <ol id="movelist"></ol>
          </details>
          <details class="card disclosure rules">
            <summary>玩法与键盘操作</summary>
            <ol>
              <li>红黑双方依次选择空点放置棋子。</li>
              <li>每回合移动到相邻空点。首次走过一条路径即占领，对手无法通行。</li>
              <li>沿己方路径反向返回后，路径关闭。轮到一方无路可走时，对方获胜。</li>
              <li id="keyboardHelp">用方向键选择棋盘上的点，按空格或回车确认。</li>
            </ol>
